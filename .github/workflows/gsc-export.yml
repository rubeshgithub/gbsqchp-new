name: Search Console export

# Pulls Google Search Console data for gbsqchp.com with a read-only service account (secret GSC_SERVICE_ACCOUNT_JSON)
# and force-pushes it to the `gsc-data` branch (one commit, replaced each run). The repository is public, so the data
# is encrypted to the public key in .github/gsc-export-public-key.pem first; only the holder of the matching private
# key can read it.
# The script prints counts only, never data rows.

# Run on demand only: the weekly SEO review session generates a fresh key pair, commits the public key, then
# dispatches this workflow – a fixed schedule would encrypt to a key nobody holds any more.
on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days of data to export (max 480)
        default: '90'

permissions:
  contents: write # to push the encrypted export to the gsc-data branch

concurrency:
  group: gsc-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Export
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          DAYS: ${{ inputs.days || '90' }}
        run: python scripts/gsc-export.py gsc-out "$DAYS"
      - name: Encrypt
        run: |
          set -euo pipefail
          tar -czf gsc.tar.gz gsc-out
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in gsc.tar.gz -out gsc.tar.gz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/gsc-export-public-key.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key.bin -out key.bin.enc
          rm -rf gsc-out gsc.tar.gz key.bin
      - name: Publish to the gsc-data branch
        run: |
          set -euo pipefail
          mkdir publish && mv gsc.tar.gz.enc key.bin.enc publish/
          cd publish
          printf 'Encrypted Search Console export (see .github/workflows/gsc-export.yml on main).\n' > README.md
          git init -q -b gsc-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Search Console export $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gsc-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
